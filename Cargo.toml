[workspace]
resolver = "2"
members = [
    "crates/omni-core",
    "crates/omni-extract",
    "crates/omni-server",
    "crates/omni-cli",
    "crates/omni-mcp",
    "crates/omni-node",
    "crates/omni-pro-stub",
    "crates/mupdf-sys",
    "omni-pro",
    "omni-pro/crates/omni-geo",
    "omni-pro/crates/omni-cleanup",
    "omni-pro/crates/omni-cover",
    "omni-pro/crates/omni-vision",
]

[workspace.package]
version = "0.1.9"
edition = "2021"
authors = ["Firefly Team <support@firefly.ai>"]
license = "Apache-2.0"
repository = "https://github.com/Leonard-Li777/firefly-omni"
homepage = "https://github.com/Leonard-Li777/firefly-omni"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tower = "0.5"
clap = { version = "4.5", features = ["derive", "env"] }
image = "0.25"
encoding_rs = "0.8"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled", "serialize"] }
sha2 = "0.10"
unicode-normalization = "0.1"
zstd = "0.13"
aes-gcm = { version = "0.10", features = ["aes"] }
crc32fast = "1.4"
rand = "0.8"
jieba-rs = "0.7"

[patch.crates-io]
mupdf-sys = { path = "crates/mupdf-sys" }
# Windows/MSVC 兼容修复：上游 usearch 2.26.2 的 build.rs 在 Windows 上硬编码 `/std:c++17`，
# 与 cxxbridge 生成的 C++ 代码在 MSVC 14.4x 下触发 C2440（指向成员函数类型不相关）编译失败。
# 本地 vendor 副本改用 `/std:c++20` 完成重载解析，规避该上游缺陷，保证 omni-pro 依赖链可编译。
usearch = { path = "vendor/usearch" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# 开发与 watch 模式：加速第三方依赖执行速度（让 debug 版 exe 跑得飞快且保持快速增量编译）
[profile.dev.package."*"]
opt-level = 2

# 快速 release 测试 profile：保留优化，使用 thin LTO 与 16 并行 codegen 大幅缩短生成 exe 耗时
[profile.quick-release]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
