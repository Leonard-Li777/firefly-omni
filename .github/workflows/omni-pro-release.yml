name: omni-pro-release

on:
  # 手动触发，支持选择版本类型和目标分支
  workflow_dispatch:
    inputs:
      edition:
        description: '构建版本类型'
        required: true
        default: 'pro'
        type: choice
        options:
          - pro
          - ce
      ref:
        description: '构建分支或标签（默认 master）'
        required: false
        default: 'master'
      version_tag:
        description: '发布版本号（如 v0.1.0），留空则使用 Cargo.toml 中的版本'
        required: false
        default: ''

# 防止同一版本并发构建
concurrency:
  group: omni-pro-release-${{ github.event.inputs.edition }}-${{ github.event.inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.os }} / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_suffix: windows-x86_64
            archive_ext: zip

          # macOS x86_64 (Intel 交叉编译)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_suffix: macos-x86_64
            archive_ext: tar.gz

          # macOS aarch64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_suffix: macos-aarch64
            archive_ext: tar.gz

          # Linux x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x86_64
            archive_ext: tar.gz

          # Linux aarch64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_suffix: linux-aarch64
            archive_ext: tar.gz


    outputs:
      version: ${{ steps.version.outputs.version }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码（含 Pro 私有子模块）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          token: ${{ secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRO_SUBMODULE_TOKEN || secrets.SUBMODULE_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: ${{ matrix.target }}-${{ github.event.inputs.edition }}

      - name: 安装 Linux aarch64 交叉编译工具链
        if: matrix.target == 'aarch64-unknown-linux-gnu' && runner.os == 'Linux'
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" != "aarch64" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi

      - name: 安装 Linux 构建依赖与 libclang
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            cmake \
            clang \
            libclang-dev \
            libclang1 \
            llvm \
            llvm-dev \
            libfreetype-dev \
            libfontconfig-dev
          # 动态解析 LLVM lib 目录并设置 LIBCLANG_PATH 与 LD_LIBRARY_PATH
          LLVM_LIB_DIR=$(llvm-config --libdir 2>/dev/null || true)
          if [ -z "$LLVM_LIB_DIR" ] || [ ! -d "$LLVM_LIB_DIR" ]; then
            LLVM_LIB_DIR=$(dirname $(find /usr/lib/llvm* -name "libclang.so*" 2>/dev/null | head -n 1) 2>/dev/null || true)
          fi
          if [ -n "$LLVM_LIB_DIR" ] && [ -d "$LLVM_LIB_DIR" ]; then
            echo "LIBCLANG_PATH=$LLVM_LIB_DIR" >> $GITHUB_ENV
            echo "LD_LIBRARY_PATH=$LLVM_LIB_DIR:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
            echo "🔍 Linux LIBCLANG_PATH 已配置: $LLVM_LIB_DIR"
          fi

      - name: 配置 macOS 构建环境与 libclang
        if: runner.os == 'macOS'
        run: |
          SDK_PATH="$(xcrun --show-sdk-path)"
          echo "SDKROOT=$SDK_PATH" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $SDK_PATH" >> $GITHUB_ENV

          XCODE_CLANG_LIB="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          if [ -f "$XCODE_CLANG_LIB/libclang.dylib" ]; then
            echo "LIBCLANG_PATH=$XCODE_CLANG_LIB" >> $GITHUB_ENV
            echo "🔍 macOS LIBCLANG_PATH 已配置 (Xcode): $XCODE_CLANG_LIB"
          else
            brew install llvm
            echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV
            echo "🔍 macOS LIBCLANG_PATH 已配置 (Homebrew): $(brew --prefix llvm)/lib"
          fi

      - name: 配置 Windows 构建环境与 libclang
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for zdir in "C:/Program Files/7-Zip" "C:/Program Files (x86)/7-Zip"; do
            if [ -d "$zdir" ]; then
              echo "$zdir" >> $GITHUB_PATH
              echo "PATH=$zdir:$PATH" >> $GITHUB_ENV
              echo "🔍 7-Zip 已加入 PATH: $zdir"
              break
            fi
          done

          if [ -d "C:/Program Files/LLVM/bin" ]; then
            echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> $GITHUB_ENV
            echo "PATH=C:/Program Files/LLVM/bin:$PATH" >> $GITHUB_ENV
            echo "🔍 Windows LIBCLANG_PATH 已配置: C:/Program Files/LLVM/bin"
          else
            choco install llvm -y --no-progress
            echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> $GITHUB_ENV
            echo "PATH=C:/Program Files/LLVM/bin:$PATH" >> $GITHUB_ENV
            echo "🔍 Windows LIBCLANG_PATH 已安装并配置: C:/Program Files/LLVM/bin"
          fi

      - name: 配置构建版本（CE / Pro）
        shell: bash
        run: |
          if [ "${{ github.event.inputs.edition }}" = "ce" ]; then
            echo "🌍 构建社区开源版 (CE)..."
            # CE 版使用 omni-pro-stub，排除私有 submodule
            node scripts/configure-edition.js --ce 2>/dev/null || true
          else
            echo "🔒 构建企业专有版 (Pro)..."
          fi

      - name: 下载 libmupdf 预编译静态库
        shell: bash
        run: |
          # macOS 统一使用 Universal 通用胖静态库，Windows 使用 zip，Linux 使用对应平台 tar.gz
          if [ "${{ runner.os }}" = "macOS" ]; then
            ASSET_NAME="libmupdf-macos-universal.tar.gz"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            ASSET_NAME="libmupdf-windows-x86_64.zip"
          else
            ASSET_NAME="libmupdf-${{ matrix.artifact_suffix }}.tar.gz"
          fi

          echo "📥 下载 ${ASSET_NAME}..."
          node scripts/download-libmupdf.js --asset "${ASSET_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 MuPDF 编译环境变量
        shell: bash
        run: |
          LIB_DIR="build/libmupdf/${{ matrix.artifact_suffix }}"
          if [ -d "$LIB_DIR" ]; then
            if [ "${{ runner.os }}" = "Windows" ]; then
              ABS_LIB="$(cd "$LIB_DIR" && pwd -W 2>/dev/null || pwd -P)"
            else
              ABS_LIB="$(cd "$LIB_DIR" && pwd -P)"
            fi
            echo "MUPDF_LIB=$ABS_LIB" >> $GITHUB_ENV
            echo "MUPDF_DIR=$ABS_LIB" >> $GITHUB_ENV
            echo "MUPDF_LIB_DIR=$ABS_LIB" >> $GITHUB_ENV
            echo "MUPDF_INCLUDE_DIR=$ABS_LIB/include" >> $GITHUB_ENV
            echo "MUPDF_STATIC=1" >> $GITHUB_ENV
            echo "✅ 已配置 MuPDF 编译环境变量: $ABS_LIB"
          else
            echo "⚠️ 未找到预编译 libmupdf: $LIB_DIR，将使用 vendored 编译路径"
          fi

      - name: 构建 firefly-omni 二进制
        shell: bash
        run: |
          cargo build \
            --manifest-path Cargo.toml \
            --bin firefly-omni \
            --release \
            --target ${{ matrix.target }}
        env:
          PKG_CONFIG_ALLOW_CROSS: 1

      - name: 打包产物
        shell: bash
        run: |
          BIN_NAME="firefly-omni"
          TARGET_DIR="target/${{ matrix.target }}/release"
          ARTIFACT_NAME="firefly-omni-${{ matrix.artifact_suffix }}"

          mkdir -p dist

          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_NAME="${BIN_NAME}.exe"
            cp "${TARGET_DIR}/${BIN_NAME}" "dist/${BIN_NAME}"
            cd dist
            7z a "${ARTIFACT_NAME}.zip" "${BIN_NAME}"
            echo "ARTIFACT_PATH=dist/${ARTIFACT_NAME}.zip" >> $GITHUB_ENV
          else
            cp "${TARGET_DIR}/${BIN_NAME}" "dist/${BIN_NAME}"
            chmod +x "dist/${BIN_NAME}"
            cd dist
            tar czf "${ARTIFACT_NAME}.tar.gz" "${BIN_NAME}"
            echo "ARTIFACT_PATH=dist/${ARTIFACT_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: 上传构建构件（供统一资源中心聚合发布）
        uses: actions/upload-artifact@v4
        with:
          name: omni-${{ github.event.inputs.edition }}-${{ matrix.artifact_suffix }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          else
            VERSION="v$(node scripts/get-version.js)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📌 发布版本: ${VERSION}"

      # Pro 版已改由 publish-pro 聚合 job 上传构件 → 统一发布到 firefly-resources 资源中心
      # （消费端 download-preset-resources.js / 装配清单统一从该中心按平台拉取）

      - name: 发布到 GitHub Release（CE 版 → 开源仓库）
        if: github.event.inputs.edition == 'ce'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Firefly Omni CE ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: ${{ env.ARTIFACT_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 聚合发布 Pro 构件到统一资源中心（firefly-resources）
  # 收集全部平台产物 → 组装多平台 manifest → publish-resources.js 上传 resources tag 并更新 index.json → 推送 main
  publish-pro:
    name: 聚合发布 Pro 构件到统一资源中心
    if: github.event.inputs.edition == 'pro'
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRO_SUBMODULE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.SUBMODULE_ACCESS_TOKEN || secrets.RELEASE_TOKEN || secrets.PAT || secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRO_SUBMODULE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.SUBMODULE_ACCESS_TOKEN || secrets.RELEASE_TOKEN || secrets.PAT || secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出代码（含发布脚本与 Cargo.toml）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          token: ${{ secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRO_SUBMODULE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.SUBMODULE_ACCESS_TOKEN || secrets.RELEASE_TOKEN || secrets.PAT || secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: 验证 GitHub 认证凭据
        shell: bash
        run: |
          echo "🔍 检查 GitHub CLI 认证状态..."
          if gh auth status 2>&1; then
            echo "✅ GitHub CLI 凭据有效。"
          else
            echo "⚠️ GitHub CLI 凭据无效或未配置。"
            echo "💡 请确保在 firefly-omni 仓库 Settings -> Secrets -> Actions 中配置了具有 repo 权限的 UNISOURCE_RELEASE_TOKEN 或 PRO_SUBMODULE_TOKEN。"
          fi

      - name: 下载全部构建构件
        uses: actions/download-artifact@v4
        with:
          pattern: omni-pro-*
          path: unisource-build
          merge-multiple: true

      - name: 克隆统一资源中心
        shell: bash
        run: |
          git clone --depth 1 --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/Leonard-Li777/firefly-resources.git" \
            "$GITHUB_WORKSPACE/unisource-repo"

      - name: 解析发布版本
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          else
            VERSION="v$(node scripts/get-version.js)"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "📌 聚合发布版本: ${VERSION}"

      - name: 发布到统一资源中心
        shell: bash
        run: |
          node scripts/publish-unisource.js \
            "$GITHUB_WORKSPACE/unisource-build" \
            "$VERSION" \
            --fr "$GITHUB_WORKSPACE/unisource-repo"
        env:
          GH_TOKEN: ${{ secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRO_SUBMODULE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.SUBMODULE_ACCESS_TOKEN || secrets.RELEASE_TOKEN || secrets.PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.UNISOURCE_RELEASE_TOKEN || secrets.PRO_SUBMODULE_TOKEN || secrets.PRIVATE_MONOREPO_PAT || secrets.SUBMODULE_ACCESS_TOKEN || secrets.RELEASE_TOKEN || secrets.PAT || secrets.GITHUB_TOKEN }}
