name: Build and Release Open-Source Firefly Omni

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Open-Source Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: firefly-omni-windows-x64.zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: firefly-omni-windows-arm64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: firefly-omni-macos-x64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: firefly-omni-macos-arm64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: firefly-omni-linux-x64.tar.gz

    steps:
      - name: Checkout Open-Source Repo
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Open-Source Binary
        run: cargo build --release --target ${{ matrix.target }}
