name: omni-libmupdf-build

on:
  # 仅手动触发——MuPDF 版本升级时运行一次，产物长期复用
  workflow_dispatch:
    inputs:
      mupdf_version:
        description: 'MuPDF 版本标签（如 1.24.9）'
        required: true
        default: '1.24.9'
      upload_tag:
        description: '上传到哪个 GitHub Release Tag'
        required: true
        default: 'ci-resources'

concurrency:
  group: omni-libmupdf-build-${{ github.event.inputs.mupdf_version }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-libmupdf:
    name: 编译 libmupdf / ${{ matrix.artifact_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            artifact_suffix: windows-x86_64
            archive_ext: zip
            lib_name: libmupdf.lib

          # macOS Universal (在 Apple Silicon 构建机上编译 x86_64 + arm64 并 lipo 合并为通用静态库)
          - os: macos-latest
            artifact_suffix: macos-universal
            archive_ext: tar.gz
            lib_name: libmupdf.a

          # Linux x86_64
          - os: ubuntu-22.04
            artifact_suffix: linux-x86_64
            archive_ext: tar.gz
            lib_name: libmupdf.a

          # Linux aarch64
          - os: ubuntu-22.04-arm
            artifact_suffix: linux-aarch64
            archive_ext: tar.gz
            lib_name: libmupdf.a

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Linux 编译依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake \
            clang \
            libfreetype-dev \
            libfontconfig-dev \
            libjpeg-dev \
            libopenjp2-7-dev \
            zlib1g-dev

      - name: 安装 macOS 编译依赖
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: 克隆 MuPDF 源码
        shell: bash
        run: |
          git clone \
            --depth 1 \
            --branch ${{ github.event.inputs.mupdf_version }} \
            --recurse-submodules \
            https://github.com/ArtifexSoftware/mupdf.git
          echo "✅ MuPDF ${{ github.event.inputs.mupdf_version }} 克隆完成"

      - name: 编译 MuPDF 静态库（Linux）
        if: runner.os == 'Linux'
        run: |
          cd mupdf
          make \
            HAVE_X11=no \
            HAVE_GLFW=no \
            HAVE_CURL=no \
            OS=Linux \
            build=release \
            libs \
            -j$(nproc 2>/dev/null || echo 4)

      - name: 编译 MuPDF Universal 双架构静态库（macOS）
        if: runner.os == 'macOS'
        run: |
          cd mupdf
          
          # 1. 编译 arm64 架构 (采用纯静态嵌入，避免 MacOSX.sdk zlib fdopen 宏冲突)
          echo "🔨 正在编译 macOS arm64 静态库..."
          make clean
          make \
            HAVE_X11=no \
            HAVE_GLFW=no \
            HAVE_CURL=no \
            HAVE_GLUT=no \
            XCFLAGS="-arch arm64 -DHAVE_FDOPEN=1" \
            XLIBS="-arch arm64" \
            build=release \
            libs \
            -j$(sysctl -n hw.logicalcpu || echo 4)
          mkdir -p ../mupdf-arm64
          cp build/release/libmupdf*.a ../mupdf-arm64/

          # 2. 编译 x86_64 架构 (Intel 交叉编译)
          echo "🔨 正在交叉编译 macOS x86_64 静态库..."
          make clean
          make \
            HAVE_X11=no \
            HAVE_GLFW=no \
            HAVE_CURL=no \
            HAVE_GLUT=no \
            XCFLAGS="-arch x86_64 -DHAVE_FDOPEN=1" \
            XLIBS="-arch x86_64" \
            build=release \
            libs \
            -j$(sysctl -n hw.logicalcpu || echo 4)
          mkdir -p ../mupdf-x86_64
          cp build/release/libmupdf*.a ../mupdf-x86_64/

          # 3. 使用 lipo 创建 Universal 通用胖静态库
          echo "🔗 正在合并为 Universal 通用二进制..."
          mkdir -p build/release/universal
          for lib in ../mupdf-arm64/*.a; do
            filename=$(basename "$lib")
            if [ -f "../mupdf-x86_64/$filename" ]; then
              lipo -create "$lib" "../mupdf-x86_64/$filename" -output "build/release/universal/$filename"
              echo "✅ 已生成 Universal: $filename"
            else
              cp "$lib" "build/release/universal/$filename"
            fi
          done

      - name: 设置 MSBuild 环境 (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: 编译 MuPDF 静态库（Windows）
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd mupdf
          if exist platform\win32\mupdf.sln (
            msbuild platform\win32\mupdf.sln ^
              /p:Configuration=Release ^
              /p:Platform=x64 ^
              /m
          ) else (
            nmake HAVE_GLFW=no HAVE_CURL=no build=release libs
          )

      - name: 收集产物
        shell: bash
        run: |
          OUT_DIR="libmupdf-out"
          mkdir -p "${OUT_DIR}"

          if [ "${{ runner.os }}" = "macOS" ]; then
            cp mupdf/build/release/universal/*.a "${OUT_DIR}/" 2>/dev/null || true
          else
            # 兼容 MSBuild 与 make 产生的 lib 路径 (mupdf/build, platform/win32/x64/Release, 等)
            find mupdf -name "*.lib" -o -name "*.a" 2>/dev/null | grep -E "(libmupdf|mupdf-third|mupdf-threads)" | while read f; do
              cp "$f" "${OUT_DIR}/"
              echo "📦 已收集: $f"
            done
          fi

          # 复制头文件
          cp -r mupdf/include "${OUT_DIR}/"

          echo "📂 产物目录内容:"
          ls -lh "${OUT_DIR}/"

      - name: 打包产物
        shell: bash
        run: |
          ASSET_NAME="libmupdf-${{ matrix.artifact_suffix }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${ASSET_NAME}.zip" libmupdf-out/
            echo "ASSET_FILE=${ASSET_NAME}.zip" >> $GITHUB_ENV
          else
            tar czf "${ASSET_NAME}.tar.gz" libmupdf-out/
            echo "ASSET_FILE=${ASSET_NAME}.tar.gz" >> $GITHUB_ENV
          fi
          echo "✅ 打包完成: $ASSET_FILE"

      - name: 上传到 GitHub Release（ci-resources）
        shell: bash
        run: |
          TAG="${{ github.event.inputs.upload_tag }}"
          FILE="${{ env.ASSET_FILE }}"
          echo "🚀 使用 gh CLI 上传 $FILE 到 Release $TAG..."
          gh release upload "$TAG" "$FILE" --repo "${{ github.repository }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传为 Actions Artifact（备份）
        uses: actions/upload-artifact@v4
        with:
          name: libmupdf-${{ matrix.artifact_suffix }}
          path: ${{ env.ASSET_FILE }}
          retention-days: 30
